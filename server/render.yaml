services:
  - type: web
    name: sentinel-ai-api
    runtime: python
    rootDir: server
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: '["http://localhost:5173","https://*.vercel.app"]'
    healthCheckPath: /health
    autoDeploy: true
